# Tranquilpeak config for Eve's garden.
# Sidebar is Home / Categories / About. No tag page, no archive page,
# no author job, and no social icon row.

image_dir: assets/images

sidebar:
    menu:
        home:
            title: global.home
            url: /
            icon: fa fa-home
        categories:
            title: global.categories
            url: /all-categories
            icon: fa fa-bookmark
        about:
            title: global.about
            url: /about/
            icon: fa fa-question

header:
    right_link:
        url:
        icon:
        class:

author:
    email:
    location:
    picture:
    twitter:
    google_plus:
    google_plus_business:

# 1: sidebar visible on large screens, slide-out on small screens
sidebar_behavior: 1
clear_reading: false
thumbnail_image: false
thumbnail_image_position: right
auto_thumbnail_image: false
# No personal photo. A flat color is set in source/css/garden.css.
cover_image:
favicon:
image_gallery: false
archive_pagination: false
category_pagination: true
tag_pagination: false

disqus_shortname:
gitment:
    enable: false
    github_id:
    repo:
    client_id:
    client_secret:
    post_identifier: permalink
gitalk:
    enable: false
    client_id:
    client_secret:
    owner:
    repo:
    post_identifier: path
    options:
        language: zh-TW
        perPage: 10
        distractionFreeMode: false
        enableHotKey: true
        pagerDirection: first

google_analytics_id:
baidu_analytics_id:
gravatar_email:
fb_admin_ids:
fb_app_id:

sharing_options: {}
